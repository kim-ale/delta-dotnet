[package]
name = "delta-http-headers"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["rlib"]

[dependencies]
async-trait = "0.1"
http = "=1.3.1"
object_store = { version = "=0.13.2", default-features = false, features = ["azure", "cloud"] }
serde = "1"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "rt"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "test-util"] }
wiremock = "0.6"